name: release

on:
  push:
    tags:
      - '*'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Checkout
        uses: actions/checkout@v3
      - name: Get the Ref
        id: get-ref
        uses: ankitvgupta/ref-to-tag-action@master
        with:
          ref: ${{ github.ref }}
          head_ref: ${{ github.head_ref }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: false
          tags: |
            dicegroup/tentris_server:current_build
            dicegroup/tentris_server:${{ steps.get-ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            "CONAN_USER=${{ secrets.CONAN_USER }}"
            "CONAN_PW=${{ secrets.CONAN_PW }}"

      - name: Extract binaries
        shell: bash
        env:
          asset_version: ${{ steps.get-ref.outputs.tag }}
        run: |
          container_id=$(docker create dicegroup/tentris_server:current_build)
          docker cp ${container_id}:/tentris_server ./tentris_server
          docker cp ${container_id}:/tentris_loader ./tentris_loader
          docker cp ${container_id}:/rdf2ids ./rdf2ids
          docker cp ${container_id}:/deduplicated_nt ./deduplicated_nt
          zip "tentris_${asset_version}_clang14_libstdcxx11.zip" tentris_server tentris_loader rdf2ids deduplicated_nt

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          asset_version: ${{ steps.get-ref.outputs.tag }}
        with:
          files: |
            "tentris_${{ steps.get-ref.outputs.tag }}_clang14_libstdcxx11.zip"
          tag_name: ${{ steps.get-ref.outputs.tag }}
          draft: true
