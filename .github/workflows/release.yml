name: Publish release

on:
  workflow_run:
    workflows: [ Build Dockerfile ]
    branches: [ main ]
    types: [ completed ]

concurrency:
  group: publish-release-${{ github.workflow }}-${{ github.ref }}

jobs:
  create_release:
    defaults:
      run:
        shell: bash

    name: Creates a release with static binaries
    runs-on: arc-runner-set
    steps:
      # version is retrieved using cargo
      - name: Install Cargo
        run: |
          apt-get install -y cargo

      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract asset version
        id: extract_asset_version
        shell: bash
        run: |
          echo asset_version=$(cargo metadata --offline --format-version 1 | jq -r '.packages[] | select(.name == "tentris-frontend") | .version') >> $GITHUB_ENV

      # version retrieved ✅ now the release can be put together and released
      - uses: dawidd6/action-download-artifact@v2
        name: Download executables artifacts built by 'Build Dockerfile' workflow
        with:
          workflow: build.yml
          name: tentris-frontend
          path: artifacts

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: artifacts/tentris
          tag: "v${{ env.asset_version }}"
